name: Controlli Flutter
on:
  push:
  pull_request:
jobs:
  analisi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=linux .
      - run: flutter pub get
      - run: dart format --output=none lib
      - run: flutter analyze
